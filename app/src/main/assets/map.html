<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>PackTrack Map</title>
<link rel="stylesheet" href="leaflet.css" />
<script src="leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #map { width: 100%; height: 100%; background: #1a1a1a; }
  .rider-marker {
    background: #D9383A;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 18px;
    height: 18px;
  }
  .rider-marker.halted { background: #FFB300; }
  .rider-marker.emergency { background: #D9383A; box-shadow: 0 0 8px #D9383A; animation: pulse 0.6s infinite; }
  .rider-marker.me { background: #4CAF50; border: 3px solid #fff; width: 22px; height: 22px; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
  .leaflet-tooltip {
    background: #1a1a1a;
    border: 1px solid #D9383A;
    color: #fff;
    font-family: sans-serif;
    font-size: 11px;
    font-weight: bold;
    border-radius: 3px;
    padding: 3px 7px;
  }
  .dest-marker {
    background: #D9383A;
    border: 3px solid #fff;
    border-radius: 4px;
    width: 14px;
    height: 14px;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map', {
  center: [20.5937, 78.9629],
  zoom: 5,
  zoomControl: false,
  attributionControl: false
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);
L.control.attribution({ position: 'bottomright', prefix: '© OpenStreetMap' }).addTo(map);

var riderMarkers = {};
var routeLayer = null;
var destMarker = null;
var initialLocationSet = false;

function setDestination(lat, lng) {
  if (destMarker) map.removeLayer(destMarker);
  var destIcon = L.divIcon({ className: 'dest-marker', iconSize: [14, 14], iconAnchor: [7, 7] });
  destMarker = L.marker([lat, lng], { icon: destIcon })
    .bindTooltip('DESTINATION', { permanent: false })
    .addTo(map);
  if (!initialLocationSet) {
    map.setView([lat, lng], 10);
    initialLocationSet = true;
  }
}

function drawRoute(geojsonStr) {
  try {
    var geojson = JSON.parse(geojsonStr);
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(geojson, {
      style: { color: '#D9383A', weight: 4, opacity: 0.85 }
    }).addTo(map);
    if (!initialLocationSet) {
      try { map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] }); } catch(e) {}
      initialLocationSet = true;
    }
  } catch (e) { console.error('Route draw failed', e); }
}

function updateRiders(jsonStr) {
  try {
    var riders = JSON.parse(jsonStr);
    var seenIds = {};

    riders.forEach(function(r) {
      seenIds[r.id] = true;
      var cls = r.isMe ? 'me' : (r.status === 'halted' || r.status === 'emergency' ? r.status : '');
      var icon = L.divIcon({ className: 'rider-marker ' + cls, iconSize: r.isMe ? [22,22] : [18,18], iconAnchor: r.isMe ? [11,11] : [9,9] });
      var tooltip = r.name + (r.status !== 'active' ? ' [' + r.status.toUpperCase() + ']' : '');

      if (riderMarkers[r.id]) {
        riderMarkers[r.id].setLatLng([r.lat, r.lng]);
        riderMarkers[r.id].setIcon(icon);
        riderMarkers[r.id].setTooltipContent(tooltip);
      } else {
        riderMarkers[r.id] = L.marker([r.lat, r.lng], { icon: icon })
          .bindTooltip(tooltip, { permanent: true, direction: 'top', offset: [0, -12] })
          .addTo(map);
      }

      if (r.isMe && !initialLocationSet) {
        map.setView([r.lat, r.lng], 14);
        initialLocationSet = true;
      }
    });

    // Remove markers for riders who left
    Object.keys(riderMarkers).forEach(function(id) {
      if (!seenIds[id]) {
        map.removeLayer(riderMarkers[id]);
        delete riderMarkers[id];
      }
    });
  } catch (e) { console.error('updateRiders failed', e); }
}

if (window.Android) window.Android.onMapReady();
</script>
</body>
</html>
